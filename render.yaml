services:
  - type: web
    name: fashionkart
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0

databases:
  - name: fashionkart-db
    databaseName: fashionkart
    user: fashionkart_user
